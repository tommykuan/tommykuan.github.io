<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tommy Kuan</title>
<meta name="description" content="Tommy Kuan, Engineering Manager.">
<meta name="theme-color" content="#050506">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#050506}
  body{color:#F4F4F2;font:17px/1.5 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #bg{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .nogl #bg{display:none}
  .nogl body{background:radial-gradient(120% 80% at 70% 20%,#3a3d44 0%,#111214 45%,#050506 100%)}
  main{position:relative;height:100svh;display:flex;align-items:flex-end;padding:0 max(24px,5vw) max(40px,9vh)}
  .id{text-shadow:0 2px 24px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5)}
  h1{margin:0;font-weight:600;font-size:clamp(44px,7.5vw,88px);letter-spacing:-.035em;line-height:.95}
  p{margin:14px 0 0;font-size:clamp(16px,1.7vw,20px);color:#C9CCD1;letter-spacing:.01em}
  @media (max-width:600px){
    main{align-items:center;justify-content:flex-start;padding:0 24px}
    h1{font-size:clamp(56px,17vw,72px);line-height:.92}
    h1 span{display:block}
    p{font-size:17px}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="id">
    <h1><span>Tommy</span> <span>Kuan</span></h1>
    <p>Engineering Manager</p>
  </div>
</main>
<script>
/* Silver liquid chrome — WebGL fragment shader (locked settings below). */
const FRAG=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;uniform float T;uniform vec2 OFF;
uniform float SCALE,WARP,OCT,LACU,RELIEF,SHINE,SPEC,SHEEN,ENVR,ENVF,GAP,GAPS,AMB,DIFP,LANG,LEL,SPD,GRAIN,DUO,DMIX,DSOFT,CONTRAST,FLOWDIR,STRETCH;
uniform vec3 C0,C1,C2,C3,D0,D1,D2,D3;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5,s=0.;
  for(int i=0;i<6;i++){if(float(i)>=OCT)break;v+=a*n(p);s+=a;p=p*LACU+vec2(1.7,9.2);a*=.5;}
  return v/s;}
float H(vec2 p,float t){
  vec2 dir=vec2(cos(FLOWDIR),sin(FLOWDIR));
  vec2 w=vec2(fbm(p*.9+dir*t*.07+vec2(0.,-t*.03)),fbm(p*.9+vec2(5.2,1.3)-dir*t*.06+vec2(t*.03,0.)));
  return fbm(p+WARP*w+dir*t*.04);
}
vec3 ramp(float x,vec3 a,vec3 b,vec3 c,vec3 d){
  x=clamp(x,0.,1.);
  if(x<.33)return mix(a,b,smoothstep(0.,.33,x));
  if(x<.7)return mix(b,c,smoothstep(.33,.7,x));
  return mix(c,d,smoothstep(.7,1.,x));
}
void main(){
  vec2 p=(gl_FragCoord.xy/min(R.y,R.x*1.4)+OFF)*SCALE;p.y*=STRETCH;float t=T*SPD;
  float e=.003;
  float h0=H(p,t),hx=H(p+vec2(e,0.),t),hy=H(p+vec2(0.,e),t);
  vec3 nr=normalize(vec3(-(hx-h0)/e*RELIEF,-(hy-h0)/e*RELIEF,1.));
  vec3 L=normalize(vec3(cos(LANG)*cos(LEL),sin(LANG)*cos(LEL),sin(LEL)));
  vec3 V=vec3(0.,0.,1.);
  float dif=max(dot(nr,L),0.);
  float rv=max(dot(reflect(-L,nr),V),0.);
  float spec=pow(rv,SHINE);
  float sheen=pow(rv,max(SHINE*.14,1.5));
  float rim=pow(1.-nr.z,1.4);
  vec3 rf=reflect(-V,nr);
  float env=smoothstep(.2,.65,.5+.5*sin(rf.y*ENVF+rf.x*ENVF*.5+h0*3.));
  float body=smoothstep(GAP-GAPS,GAP+GAPS,h0);
  float lum=body*(AMB+pow(dif,DIFP)*.85+sheen*SHEEN+env*rim*ENVR)+spec*SPEC*body;
  lum=pow(clamp(lum,0.,1.4)/1.1,CONTRAST);
  vec3 col=ramp(lum,C0,C1,C2,C3);
  if(DUO>.5){
    float g=fbm(p*DMIX+vec2(9.1,3.7)+vec2(t*.03,-t*.02));
    col=mix(col,ramp(lum,D0,D1,D2,D3),smoothstep(.5-DSOFT,.5+DSOFT,g));
  }
  col+=(h(gl_FragCoord.xy+fract(T*7.))-.5)*GRAIN;
  gl_FragColor=vec4(col,1.);
}`;





const VERT=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const DEG=Math.PI/180;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const CHROME={SCALE:2.36,WARP:2.07,OCT:3,LACU:1.9,STRETCH:1,FLOWDIR:201,SPD:.25,RELIEF:.75,SHINE:44,SPEC:.5,SHEEN:.42,ENVR:.48,ENVF:6.5,AMB:.12,DIFP:3.61,CONTRAST:1.39,GAP:.25,GAPS:.27,LANG:134,LEL:38,GRAIN:.088,DUO:0,DMIX:.55,DSOFT:.1,C0:'#050506',C1:'#2E3036',C2:'#9EA3AD',C3:'#FFFFFF',D0:'#000000',D1:'#000000',D2:'#000000',D3:'#000000'};
const bg=document.getElementById('bg');
let gl=null;try{gl=bg.getContext('webgl',{antialias:false,alpha:false});}catch(e){}
const U={};let ok=false;
if(gl){
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return gl.getShaderParameter(s,gl.COMPILE_STATUS)?s:null;};
  const vs=sh(gl.VERTEX_SHADER,VERT),fs=sh(gl.FRAGMENT_SHADER,FRAG);
  if(vs&&fs){const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    if(gl.getProgramParameter(pr,gl.LINK_STATUS)){gl.useProgram(pr);
      const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
      const nk=Object.keys(CHROME).filter(k=>typeof CHROME[k]==='number');
      ['R','T','OFF','C0','C1','C2','C3','D0','D1','D2','D3'].concat(nk).forEach(k=>U[k]=gl.getUniformLocation(pr,k));
      const hexv=s=>{const v=parseInt(s.slice(1),16);return[(v>>16&255)/255,(v>>8&255)/255,(v&255)/255];};
      for(const k of nk){let v=CHROME[k];if(k==='LANG'||k==='LEL'||k==='FLOWDIR')v*=DEG;gl.uniform1f(U[k],v);}
      ['C0','C1','C2','C3','D0','D1','D2','D3'].forEach(k=>gl.uniform3fv(U[k],hexv(CHROME[k])));
      gl.uniform2f(U.OFF,0,0);ok=true;}}
}
if(!ok)document.documentElement.classList.add('nogl');
let last=performance.now(),t=RM?14:0,scale=1,slow=0,fast=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;if(!RM)t+=dt;
  const dpr=Math.min(devicePixelRatio||1,1.5)*scale,w=Math.max(1,Math.round(innerWidth*dpr)),h=Math.max(1,Math.round(innerHeight*dpr));
  if(bg.width!==w||bg.height!==h){bg.width=w;bg.height=h;}
  gl.viewport(0,0,w,h);gl.uniform2f(U.R,w,h);gl.uniform1f(U.T,t);gl.drawArrays(gl.TRIANGLES,0,3);
  const ms=dt*1000;if(ms>24){slow++;fast=0;}else if(ms<13){fast++;slow=0;}          // adaptive resolution
  if(slow>20&&scale>.5){scale=Math.max(.5,scale-.1);slow=0;}if(fast>120&&scale<1){scale=Math.min(1,scale+.1);fast=0;}
  if(!RM&&!document.hidden)requestAnimationFrame(frame);
}
if(ok){requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!RM){last=performance.now();requestAnimationFrame(frame);}});}
</script>
</body>
</html>
